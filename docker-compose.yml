# Local "dev" environment: MinIO (S3) + MLflow + API + web app + Prometheus + Grafana
#   docker compose up -d minio minio-init mlflow     # 1. storage + tracking
#   make data train                                  # 2. train & register a champion
#   docker compose up -d                             # 3. everything else
x-s3-env: &s3-env
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
  MLFLOW_S3_ENDPOINT_URL: http://minio:9000

services:
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on: { minio: { condition: service_healthy } }
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin}
      && mc mb --ignore-existing local/mlflow"

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.2
    depends_on: [minio-init]
    environment: *s3-env
    command: >
      sh -c "pip install --quiet boto3 &&
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination s3://mlflow/artifacts --serve-artifacts"
    ports: ["5000:5000"]
    volumes: [mlflow-db:/mlflow]

  api:
    build: { context: ., dockerfile: Dockerfile.api }
    image: ${DOCKERHUB_USER:-yourname}/trajclf-api:latest
    depends_on: [mlflow]
    environment:
      <<: *s3-env
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_NAME: trajectory-classifier
      MODEL_ALIAS: champion
      MODEL_RUNTIME: ${MODEL_RUNTIME:-torch}
    ports: ["8000:8000"]

  webapp:
    build: { context: ., dockerfile: Dockerfile.webapp }
    image: ${DOCKERHUB_USER:-yourname}/trajclf-webapp:latest
    depends_on: [api]
    environment: { API_URL: "http://api:8000" }
    ports: ["8501:8501"]

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes: [./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]

volumes:
  minio-data:
  mlflow-db:
