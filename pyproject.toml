[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trajclf"
version = "0.1.0"
description = "Trajectory classification — MLOps pipeline + AI infrastructure study"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["e2e: needs a running API (set API_URL)", "torch: needs torch installed"]

[tool.ruff]
line-length = 120
target-version = "py310"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
[tool.ruff.lint.per-file-ignores]
"ai-infrastructure/architecture/diagrams.py" = ["E", "I001"]   # plotting script, layout tables
