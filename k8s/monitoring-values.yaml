# helm install monitoring prometheus-community/kube-prometheus-stack -n monitoring --create-namespace -f k8s/monitoring-values.yaml
prometheus:
  prometheusSpec:
    additionalScrapeConfigs:
      - job_name: trajclf-api
        kubernetes_sd_configs: [{ role: pod, namespaces: { names: [trajclf] } }]
        relabel_configs:
          - { source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape], action: keep, regex: "true" }
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - { source_labels: [__meta_kubernetes_pod_name], target_label: pod }
grafana:
  adminPassword: admin
  sidecar: { dashboards: { enabled: true, searchNamespace: ALL } }
