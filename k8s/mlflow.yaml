apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: mlflow-db, namespace: trajclf }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 1Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: mlflow, namespace: trajclf }
spec:
  replicas: 1
  selector: { matchLabels: { app: mlflow } }
  template:
    metadata: { labels: { app: mlflow } }
    spec:
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:v2.17.2
          command: ["sh", "-c"]
          args:
            - pip install --quiet boto3 && mlflow server --host 0.0.0.0 --port 5000
              --backend-store-uri sqlite:////mlflow/mlflow.db
              --artifacts-destination s3://mlflow/artifacts --serve-artifacts
          envFrom: [{ secretRef: { name: s3-credentials } }]
          env: [{ name: MLFLOW_S3_ENDPOINT_URL, value: "http://minio:9000" }]
          ports: [{ containerPort: 5000 }]
          volumeMounts: [{ name: db, mountPath: /mlflow }]
          readinessProbe: { httpGet: { path: /health, port: 5000 }, initialDelaySeconds: 20 }
      volumes: [{ name: db, persistentVolumeClaim: { claimName: mlflow-db } }]
---
apiVersion: v1
kind: Service
metadata: { name: mlflow, namespace: trajclf }
spec:
  selector: { app: mlflow }
  ports: [{ port: 5000 }]
