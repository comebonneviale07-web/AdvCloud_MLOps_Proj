apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: minio-data, namespace: trajclf }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 5Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: minio, namespace: trajclf }
spec:
  replicas: 1
  selector: { matchLabels: { app: minio } }
  template:
    metadata: { labels: { app: minio } }
    spec:
      containers:
        - name: minio
          image: cgr.dev/chainguard/minio:latest   # MinIO public images were withdrawn in Sept 2026
          securityContext: { runAsUser: 0 }
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - { name: MINIO_ROOT_USER, valueFrom: { secretKeyRef: { name: s3-credentials, key: AWS_ACCESS_KEY_ID } } }
            - { name: MINIO_ROOT_PASSWORD, valueFrom: { secretKeyRef: { name: s3-credentials, key: AWS_SECRET_ACCESS_KEY } } }
          ports: [{ containerPort: 9000 }, { containerPort: 9001 }]
          volumeMounts: [{ name: data, mountPath: /data }]
          readinessProbe: { httpGet: { path: /minio/health/ready, port: 9000 } }
      volumes: [{ name: data, persistentVolumeClaim: { claimName: minio-data } }]
---
apiVersion: v1
kind: Service
metadata: { name: minio, namespace: trajclf }
spec:
  selector: { app: minio }
  ports: [{ name: s3, port: 9000 }, { name: console, port: 9001 }]
---
apiVersion: batch/v1
kind: Job
metadata: { name: minio-create-bucket, namespace: trajclf }
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-buckets
          image: python:3.11-slim
          envFrom: [{ secretRef: { name: s3-credentials } }]
          command: ["sh", "-c"]
          args:
            - pip install --quiet boto3 && python -c "import boto3; s3=boto3.client('s3', endpoint_url='http://minio:9000'); names=[b['Name'] for b in s3.list_buckets()['Buckets']]; [s3.create_bucket(Bucket=b) for b in ('mlflow','data') if b not in names]; print('buckets ready')"
