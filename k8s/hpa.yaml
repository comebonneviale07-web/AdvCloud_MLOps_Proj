# Requires metrics-server (Docker Desktop: see README "Kubernetes").
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: trajclf-api, namespace: trajclf }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: trajclf-api }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 60 } }
  behavior:
    scaleDown: { stabilizationWindowSeconds: 120 }
