# CD: deploy the images built by CI to the local Kubernetes cluster (Docker Desktop)
# through a self-hosted runner on a team member's Windows PC (PowerShell steps).
name: CD
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted
    timeout-minutes: 40   # first pull of the ~1 GB API image (PyTorch) is slow; later pulls reuse cached layers
    defaults:
      run:
        shell: powershell
    env:
      DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.SHA }}" }

      - name: Apply manifests
        run: |
          $ErrorActionPreference = 'Continue'
          kubectl apply -k k8s/
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Deploy the images tagged with this commit SHA
        run: |
          $ErrorActionPreference = 'Continue'
          kubectl -n trajclf set image deploy/trajclf-api "api=$env:DOCKER_USER/trajclf-api:$env:SHA"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          kubectl -n trajclf set image deploy/trajclf-webapp "webapp=$env:DOCKER_USER/trajclf-webapp:$env:SHA"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          kubectl -n trajclf annotate deploy/trajclf-api "kubernetes.io/change-cause=CD $env:SHA" --overwrite

      - name: Wait for rollout (automatic rollback on failure)
        run: |
          $ErrorActionPreference = 'Continue'
          kubectl -n trajclf rollout status deploy/trajclf-api --timeout=1200s
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::error::API rollout failed, rolling back"
            kubectl -n trajclf rollout undo deploy/trajclf-api
            exit 1
          }
          kubectl -n trajclf rollout status deploy/trajclf-webapp --timeout=1200s
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Smoke test (rollback if the API does not answer)
        run: |
          $ErrorActionPreference = 'Continue'
          $pf = Start-Process kubectl -ArgumentList "-n","trajclf","port-forward","svc/trajclf-api","18000:8000" -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 5
          $ok = $false
          for ($i = 0; $i -lt 6; $i++) {
            try {
              $health = Invoke-RestMethod -Uri http://localhost:18000/health -TimeoutSec 5
              $model = Invoke-RestMethod -Uri http://localhost:18000/model -TimeoutSec 5
              if ($health.status -eq 'ok') {
                Write-Output "API healthy, serving model version $($model.version) with runtime $($model.runtime)"
                $ok = $true
                break
              }
            } catch { Start-Sleep -Seconds 5 }
          }
          Stop-Process -Id $pf.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) {
            Write-Output "::error::smoke test failed, rolling back"
            kubectl -n trajclf rollout undo deploy/trajclf-api
            exit 1
          }
          kubectl -n trajclf rollout history deploy/trajclf-api
          exit 0
